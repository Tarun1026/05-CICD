name: Manual Blue-Green Rollback

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-blue-green-deployment
  cancel-in-progress: false

jobs:
  rollback:
    name: Roll back production through SSM
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: "Docker Hub Credentials"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Run rollback on EC2 through SSM
        env:
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        shell: bash
        run: |
          set -euo pipefail
          SCRIPT_B64="$(base64 -w0 scripts/rollback-app.sh)"
          LIB_B64="$(base64 -w0 scripts/transaction-lib.sh)"
          PARAMETERS="$(jq -cn --arg script_b64 "$SCRIPT_B64" --arg lib_b64 "$LIB_B64" '{
            commands: [
              "set -u",
              ("printf %s " + ($script_b64 | @sh) + " | base64 -d > /tmp/rollback-app.sh"),
              ("printf %s " + ($lib_b64 | @sh) + " | base64 -d > /tmp/transaction-lib.sh"),
              "chmod 700 /tmp/rollback-app.sh /tmp/transaction-lib.sh",
              "for attempt in 1 2 3 4 5; do bash /tmp/rollback-app.sh && exit 0; rc=$?; if [ \"$rc\" -ne 75 ]; then exit \"$rc\"; fi; echo LOCK_BUSY retry=$attempt/5; [ \"$attempt\" -eq 5 ] || sleep 5; done; exit 75"
            ]
          }')"

          COMMAND_ID="$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Manual Blue-Green rollback" \
            --timeout-seconds 900 \
            --parameters "$PARAMETERS" \
            --query 'Command.CommandId' --output text)"

          for attempt in $(seq 1 180); do
            STATUS="$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" --instance-id "$EC2_INSTANCE_ID" \
              --query Status --output text 2>/dev/null || true)"
            echo "Rollback status: ${STATUS:-Pending}"
            case "$STATUS" in
              Success)
                aws ssm get-command-invocation --command-id "$COMMAND_ID" \
                  --instance-id "$EC2_INSTANCE_ID" \
                  --query StandardOutputContent --output text
                exit 0 ;;
              Failed|Cancelled|TimedOut|DeliveryTimedOut|ExecutionTimedOut|Undeliverable|Terminated)
                aws ssm get-command-invocation --command-id "$COMMAND_ID" \
                  --instance-id "$EC2_INSTANCE_ID" \
                  --query '{Status:Status,Error:StandardErrorContent,Output:StandardOutputContent}' \
                  --output json || true
                exit 1 ;;
            esac
            sleep 5
          done
          echo "Timed out waiting for SSM rollback command. Command ID: ${COMMAND_ID}"
          exit 1
