name: Blue-Green CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-blue-green-deployment
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21.x'
          cache: true

      - name: Format check
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(gofmt -l ./cmd ./internal)"

      - name: Unit tests
        run: go test -race -v ./...

      - name: Static analysis
        run: go vet ./...

      - name: Build application image
        run: docker build --pull -t cicd-demo-ci-test .

      - name: Container smoke test
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name cicd-demo-ci-test \
            -p 127.0.0.1:18080:8080 cicd-demo-ci-test
          cleanup() { docker rm -f cicd-demo-ci-test >/dev/null 2>&1 || true; }
          trap cleanup EXIT

          LIVE_OK=false
          for attempt in $(seq 1 20); do
            if curl --fail --silent --show-error --max-time 3 \
              http://127.0.0.1:18080/health/live -o /dev/null; then
              LIVE_OK=true
              break
            fi
            sleep 2
          done
          if [[ "$LIVE_OK" != true ]]; then
            echo "ERROR: Container liveness endpoint did not become healthy."
            docker logs cicd-demo-ci-test || true
            exit 1
          fi

          READY_OK=false
          for attempt in $(seq 1 20); do
            if curl --fail --silent --show-error --max-time 3 \
              http://127.0.0.1:18080/health/ready -o /dev/null; then
              READY_OK=true
              break
            fi
            sleep 2
          done
          if [[ "$READY_OK" != true ]]; then
            echo "ERROR: Container readiness endpoint did not become healthy."
            docker logs cicd-demo-ci-test || true
            exit 1
          fi
          echo "Both liveness and readiness endpoints returned successful HTTP statuses."

  build:
    needs: test
    runs-on: ubuntu-latest
    environment: "Docker Hub Credentials"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/cicd-demo:${{ github.sha }}
            ${{ vars.DOCKERHUB_USERNAME }}/cicd-demo:latest

  deploy:
    name: Deploy Blue-Green to EC2 through SSM
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: "Docker Hub Credentials"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deploy through SSM
        env:
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          IMAGE_TAG: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="${DOCKERHUB_USERNAME}/cicd-demo:${IMAGE_TAG}"
          SCRIPT_B64="$(base64 -w0 scripts/deploy-blue-green.sh)"
          LIB_B64="$(base64 -w0 scripts/transaction-lib.sh)"
          PARAMETERS="$(jq -cn --arg script_b64 "$SCRIPT_B64" --arg lib_b64 "$LIB_B64" --arg image "$IMAGE" '{
            commands: [
              "set -u",
              ("printf %s " + ($script_b64 | @sh) + " | base64 -d > /tmp/deploy-blue-green.sh"),
              ("printf %s " + ($lib_b64 | @sh) + " | base64 -d > /tmp/transaction-lib.sh"),
              "chmod 700 /tmp/deploy-blue-green.sh /tmp/transaction-lib.sh",
              ("for attempt in 1 2 3 4 5; do bash /tmp/deploy-blue-green.sh " + ($image | @sh) + " && exit 0; rc=$?; if [ \"$rc\" -ne 75 ]; then exit \"$rc\"; fi; echo LOCK_BUSY retry=$attempt/5; [ \"$attempt\" -eq 5 ] || sleep 5; done; exit 75")
            ]
          }')"

          COMMAND_ID="$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Blue-Green deployment ${IMAGE_TAG}" \
            --timeout-seconds 900 \
            --parameters "$PARAMETERS" \
            --query 'Command.CommandId' --output text)"

          for attempt in $(seq 1 180); do
            STATUS="$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" --instance-id "$EC2_INSTANCE_ID" \
              --query Status --output text 2>/dev/null || true)"
            echo "Deployment status: ${STATUS:-Pending}"
            case "$STATUS" in
              Success)
                aws ssm get-command-invocation --command-id "$COMMAND_ID" \
                  --instance-id "$EC2_INSTANCE_ID" \
                  --query StandardOutputContent --output text
                exit 0 ;;
              Cancelled|TimedOut|DeliveryTimedOut|ExecutionTimedOut|Undeliverable|Terminated|Failed)
                aws ssm get-command-invocation --command-id "$COMMAND_ID" \
                  --instance-id "$EC2_INSTANCE_ID" \
                  --query '{Status:Status,Error:StandardErrorContent,Output:StandardOutputContent}' \
                  --output json || true
                exit 1 ;;
            esac
            sleep 5
          done
          echo "Timed out waiting for SSM deployment command. Command ID: ${COMMAND_ID}"
          exit 1
