name: First CI Pipeline

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show files
        run: ls -la

      - name: Run our test
        run: |
          echo "Running CI test..."
          grep -q "Hello from CI/CD lab" app.txt

  build:
    needs: test
    runs-on: ubuntu-latest
    environment: "Docker Hub Credentials"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/cicd-demo:${{ github.sha }}
            ${{ vars.DOCKERHUB_USERNAME }}/cicd-demo:latest


  deploy:
    name: Deploy to AWS EC2 via SSM
    needs: build
    runs-on: ubuntu-latest
    environment: "Docker Hub Credentials"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deploy Blue-Green through SSM
        env:
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          IMAGE_TAG: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          IMAGE="${DOCKERHUB_USERNAME}/cicd-demo:${IMAGE_TAG}"
          APP_CONTENT="$(cat app.txt)"
          SCRIPT_B64="$(base64 -w0 scripts/deploy-blue-green.sh)"

          echo "Image: ${IMAGE}"
          echo "Expected application content: ${APP_CONTENT}"

          PARAMETERS=$(jq -cn \
            --arg script_b64 "$SCRIPT_B64" \
            --arg image "$IMAGE" \
            --arg expected "$APP_CONTENT" \
            '{
              commands: [
                "set -euo pipefail",
                ("printf %s " + ($script_b64 | @sh) + " | base64 -d > /tmp/deploy-blue-green.sh"),
                "chmod +x /tmp/deploy-blue-green.sh",
                ("bash /tmp/deploy-blue-green.sh " + ($image | @sh) + " " + ($expected | @sh))
              ]
            }')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy Blue-Green application" \
            --parameters "$PARAMETERS" \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM command ID: $COMMAND_ID"

          for attempt in $(seq 1 36); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query 'Status' \
              --output text 2>/dev/null || true)

            echo "Deployment status: ${STATUS:-Pending}"

            case "$STATUS" in
              Success)
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$EC2_INSTANCE_ID" \
                  --query 'StandardOutputContent' \
                  --output text
                exit 0
                ;;
              Failed|Cancelled|TimedOut|Cancelling)
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$EC2_INSTANCE_ID" \
                  --query '{Status:Status,Error:StandardErrorContent,Output:StandardOutputContent}' \
                  --output json
                exit 1
                ;;
            esac

            sleep 5
          done

          echo "Timed out waiting for the SSM deployment command."
          exit 1
