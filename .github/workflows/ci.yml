name: First CI Pipeline

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show files
        run: ls -la

      - name: Run our test
        run: |
          echo "Running CI test..."
          grep -q "Hello from CI/CD lab" app.txt

  build:
    needs: test
    runs-on: ubuntu-latest
    environment: "Docker Hub Credentials"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/cicd-demo:${{ github.sha }}
            ${{ vars.DOCKERHUB_USERNAME }}/cicd-demo:latest

 
  deploy:
    name: Deploy to AWS EC2 via SSM
    needs: build
    runs-on: ubuntu-latest
    environment: "Docker Hub Credentials"

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deploy Docker image through SSM
        env:
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          IMAGE_TAG: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          IMAGE="${DOCKERHUB_USERNAME}/cicd-demo:${IMAGE_TAG}"
          echo "Deploying image: ${IMAGE}"

          PARAMETERS=$(jq -cn --arg image "$IMAGE" '{
            commands: [
              "set -e",
              ("docker pull " + $image),
              "docker stop cicd-demo-app 2>/dev/null || true",
              "docker rm cicd-demo-app 2>/dev/null || true",
              ("docker run -d --restart unless-stopped --name cicd-demo-app -p 80:80 " + $image),
              "docker ps --filter name=cicd-demo-app",
              "curl --fail --retry 5 --retry-delay 2 http://localhost/app.txt"
            ]
          }')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy CI/CD Docker image" \
            --parameters "$PARAMETERS" \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM command ID: $COMMAND_ID"

          for attempt in $(seq 1 30); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query 'Status' \
              --output text 2>/dev/null || true)

            echo "Deployment status: ${STATUS:-Pending}"

            case "$STATUS" in
              Success)
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$EC2_INSTANCE_ID" \
                  --query 'StandardOutputContent' \
                  --output text
                exit 0
                ;;
              Failed|Cancelled|TimedOut|Cancelling)
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$EC2_INSTANCE_ID" \
                  --query '{Status:Status,Error:StandardErrorContent,Output:StandardOutputContent}' \
                  --output json
                exit 1
                ;;
            esac

            sleep 5
          done

          echo "Timed out waiting for the SSM deployment command."
          exit 1
