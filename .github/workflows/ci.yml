name: First CI Pipeline

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show files
        run: ls -la

      - name: Run our test
        run: |
          echo "Running CI test..."
          grep -q "Hello from CI/CD lab" app.txt

  build:
    needs: test
    runs-on: ubuntu-latest
    environment: "Docker Hub Credentials"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/cicd-demo:${{ github.sha }}
            ${{ vars.DOCKERHUB_USERNAME }}/cicd-demo:latest

  deploy:
    name: Deploy to AWS EC2
    needs: build
    runs-on: ubuntu-latest
    environment: "Docker Hub Credentials"

    steps:
      - name: Configure SSH
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          set -e

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key

          ssh-keygen -y -f ~/.ssh/ec2_key > /dev/null
          echo "Private key is valid"

          echo "Testing TCP port 22..."
          if timeout 10 bash -c 'echo > /dev/tcp/$1/22' _ "$EC2_HOST"; then
            echo "TCP port 22 is reachable"
          else
            echo "TCP port 22 is NOT reachable from GitHub Actions"
            exit 1
          fi

          echo "Retrieving SSH host key..."
          ssh-keyscan -T 10 -H "$EC2_HOST" >> ~/.ssh/known_hosts
          echo "SSH host key retrieved"

      - name: Deploy Docker image to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE="${DOCKERHUB_USERNAME}/cicd-demo:${IMAGE_TAG}"

          ssh -i ~/.ssh/ec2_key \
            -o StrictHostKeyChecking=yes \
            "${EC2_USERNAME}@${EC2_HOST}" \
            "IMAGE='${IMAGE}' bash -s" <<'REMOTE'
              set -e

              docker pull "$IMAGE"

              docker stop cicd-demo-app 2>/dev/null || true
              docker rm cicd-demo-app 2>/dev/null || true

              docker run -d \
                --restart unless-stopped \
                --name cicd-demo-app \
                -p 80:80 \
                "$IMAGE"

              docker ps --filter name=cicd-demo-app

              curl --fail --retry 5 --retry-delay 2 \
                http://localhost/app.txt
          REMOTE
